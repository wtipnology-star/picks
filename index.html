<style>
  :root{
    --orange:#F2901E; --ink:#0D0D0D; --paper:#F4EEE6;
    --grey:#6B6B6B;   --warm:#9A9389;
    --surface:#151515; --raised:#1B1B1B; --line:#272727; --line-soft:#1D1D1D;
    --ar:'Cairo',system-ui,sans-serif;
    --lat:'Archivo',system-ui,sans-serif;
    --maxw:1080px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--ink);color:var(--paper);font-family:var(--ar);
       -webkit-font-smoothing:antialiased;line-height:1.75}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

  /* wide surface takes the wordmark, never the symbol */
  .wordmark{font-family:var(--lat);font-weight:900;letter-spacing:-.05em;
            text-transform:lowercase;direction:ltr;display:inline-block;
            font-size:21px;line-height:1;color:var(--paper)}
  .wordmark::after{content:"";display:inline-block;vertical-align:baseline;
                   width:.14em;height:.14em;border-radius:50%;
                   background:var(--orange);margin-left:.07em}

  header{position:sticky;top:0;z-index:60;background:rgba(13,13,13,.93);
         backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
  .bar{display:flex;align-items:center;justify-content:space-between;height:60px;gap:14px}
  .head-right{display:flex;align-items:center;gap:12px}
  .handle{font-family:var(--lat);font-weight:600;font-size:12px;letter-spacing:.04em;
          color:var(--grey);text-decoration:none;direction:ltr}
  .handle:hover{color:var(--orange)}
  .lang{font-family:var(--lat);font-weight:700;font-size:11px;letter-spacing:.08em;
        background:transparent;color:var(--grey);border:1px solid var(--line);
        border-radius:2px;padding:7px 11px;cursor:pointer;transition:border-color .15s,color .15s}
  .lang:hover{border-color:var(--orange);color:var(--orange)}
  .lang:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

  .hero{padding:60px 0 40px;border-bottom:1px solid var(--line-soft)}
  .eyebrow{font-size:13px;font-weight:600;color:var(--orange);margin-bottom:16px;
           display:flex;align-items:center;gap:10px}
  .eyebrow::before{content:"";width:22px;height:2px;background:var(--orange);flex:none}
  h1{font-weight:900;font-size:clamp(32px,7vw,58px);line-height:1.2;margin-bottom:20px}
  html[dir="ltr"] h1{font-family:var(--lat);letter-spacing:-.03em;line-height:1.02;
                     text-transform:lowercase}
  h1 em{font-style:normal;color:var(--orange)}
  .lede{max-width:56ch;color:var(--warm);font-size:16px}
  .lede strong{color:var(--paper);font-weight:700}
  .stats{display:flex;gap:34px;margin-top:30px;flex-wrap:wrap}
  .stat-n{font-family:var(--lat);font-weight:900;font-size:27px;line-height:1;
          direction:ltr;font-variant-numeric:tabular-nums}
  .stat-l{font-size:12px;color:var(--grey);margin-top:6px}

  .toolbar{position:sticky;top:60px;z-index:50;background:var(--ink);padding:22px 0 18px}
  .search{position:relative;margin-bottom:16px}
  .search .ico{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);
               width:17px;height:17px;stroke:var(--grey);fill:none;stroke-width:2;
               pointer-events:none;transition:stroke .15s}
  #q{width:100%;height:48px;padding-inline-start:44px;padding-inline-end:44px;
     background:var(--surface);color:var(--paper);border:1px solid var(--line);
     border-radius:3px;font-family:var(--ar);font-size:15px;transition:border-color .15s}
  #q::placeholder{color:var(--grey)}
  #q:focus{outline:none;border-color:var(--orange)}
  #q:focus + .ico{stroke:var(--orange)}
  .clear{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);
         background:transparent;border:0;color:var(--grey);cursor:pointer;font-size:20px;
         line-height:1;padding:5px;display:none}
  .clear:hover{color:var(--orange)}
  .clear.on{display:block}

  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-family:var(--ar);font-size:13px;font-weight:700;padding:8px 15px;
        background:transparent;color:var(--grey);border:1px solid var(--line);
        border-radius:2px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .chip:hover{border-color:var(--warm);color:var(--paper)}
  .chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--ink)}
  .chip:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  .count{font-size:12px;color:var(--grey);padding-top:14px}

  .grid{display:grid;grid-template-columns:1fr;gap:14px;padding:16px 0 56px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}

  /* ---- Phones: shrink the hero so products surface sooner, and float the
     search as a bottom bar within thumb reach. Desktop keeps search up top. ---- */
  @media(max-width:639px){
    .hero{padding:26px 0 22px}
    .eyebrow{margin-bottom:12px}
    h1{margin-bottom:12px}
    .lede{font-size:15px}
    .stats{margin-top:18px;gap:22px}
    .stat-n{font-size:22px}

    /* the top toolbar now carries only the filters + count */
    .toolbar{padding:14px 0 10px}

    /* search floats at the bottom, pinned above the home indicator */
    .searchbar{
      position:fixed; inset-inline:0; bottom:0; z-index:65;
      padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
      background:rgba(13,13,13,.90); backdrop-filter:blur(12px);
      border-top:1px solid var(--line);
    }
    .searchbar .search{margin-bottom:0}
    #q{height:52px; box-shadow:0 8px 26px rgba(0,0,0,.45)}

    /* room at the end so the last card can scroll clear of the floating bar */
    body{padding-bottom:84px}
  }

  .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:3px;
        overflow:hidden;display:flex;flex-direction:column;position:relative;
        transition:border-color .18s,transform .18s}
  .card::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:2px;
                background:var(--orange);transform:scaleY(0);transform-origin:top;
                transition:transform .22s ease}
  .card:hover{border-color:var(--line);transform:translateY(-2px)}
  .card:hover::before{transform:scaleY(1)}

  .strip{display:flex;justify-content:space-between;align-items:center;
         font-size:12px;font-weight:600;margin-bottom:8px}
  .cat{color:var(--grey)}
  .tested{color:var(--orange);display:flex;align-items:center;gap:6px;font-weight:700}
  .tested::before{content:"";width:5px;height:5px;background:var(--orange);
                  border-radius:50%;flex:none}

  .shot{aspect-ratio:4/3;background:var(--raised);display:flex;align-items:center;
        justify-content:center;overflow:hidden}
  /* show the whole product (no crop); real product shots sit on a white tile,
     empty placeholders keep the dark surface */
  .shot:has(img){background:#fff}
  .shot img{width:100%;height:100%;object-fit:contain;display:block}
  .ph{font-family:var(--lat);font-weight:600;font-size:10px;letter-spacing:.14em;
      text-transform:uppercase;color:#3A3A3A}

  .body{padding:16px 14px 18px;display:flex;flex-direction:column;flex:1}
  .name{font-size:17px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--paper)}
  .verdict{color:var(--warm);font-size:14px;line-height:1.8;margin-bottom:18px;flex:1}
  mark{background:transparent;color:var(--orange);font-weight:700}

  .foot{padding-top:14px;border-top:1px solid var(--line-soft)}
  .buy{display:block;text-align:center;font-family:var(--ar);font-size:13px;font-weight:700;
       padding:11px 22px;background:var(--orange);color:var(--ink);text-decoration:none;
       border-radius:2px;transition:filter .15s}
  .buy:hover{filter:brightness(1.12)}
  .buy:focus-visible{outline:2px solid var(--paper);outline-offset:2px}

  .disclose{border:1px solid var(--line);border-inline-start:2px solid var(--orange);
            background:var(--surface);padding:22px;border-radius:3px;margin-bottom:48px}
  .disclose h2{font-size:14px;color:var(--orange);font-weight:700;margin-bottom:10px}
  .disclose p{color:var(--warm);font-size:14.5px;max-width:66ch;line-height:1.9}
  .disclose strong{color:var(--paper);font-weight:700}

  footer{border-top:1px solid var(--line-soft);padding:34px 0 52px}
  .fbar{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:24px}
  .lockup-ar{text-align:right}
  .ar-name{font-weight:900;font-size:24px;line-height:1.2;color:var(--paper)}
  .ar-sub{display:flex;align-items:center;gap:8px;margin-top:5px}
  .rule{width:26px;height:3px;background:var(--orange);flex:none}
  .wordmark.sm{font-size:11px}
  .lockup-lat{text-align:left}
  .lat-sub{display:flex;align-items:center;gap:9px;margin-top:6px}
  .lat-name{font-family:var(--lat);font-weight:700;font-size:9.5px;letter-spacing:.30em;
            text-transform:uppercase;color:var(--grey)}
  .fright{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
  .socials{display:flex;gap:10px}
  .soc{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
       border:1px solid var(--line);border-radius:3px;color:var(--grey);
       transition:border-color .15s,color .15s,transform .15s}
  .soc svg{width:18px;height:18px;fill:currentColor;display:block}
  .soc:hover{border-color:var(--orange);color:var(--orange);transform:translateY(-2px)}
  .soc:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  .fmail{font-size:13px;font-weight:600;color:var(--grey);text-decoration:none}
  .fmail:hover{color:var(--orange)}

  .state{grid-column:1/-1;padding:56px 20px;text-align:center;font-size:15px;color:var(--grey)}
  .state b{display:block;color:var(--paper);margin-bottom:6px;font-weight:700}

  .skel{background:var(--surface);border:1px solid var(--line-soft);border-radius:3px;
        height:340px;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.8}}

  @media(prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    html{scroll-behavior:auto}
  }

  /* Brand: Archivo carries every Latin surface. In English mode the body and the
     three controls that pin themselves to Cairo flip to Archivo. Arabic mode is
     untouched, so Cairo still owns Arabic and never inherits Latin tracking. */
  html[dir="ltr"] body{font-family:var(--lat)}
  html[dir="ltr"] #q,
  html[dir="ltr"] .chip,
  html[dir="ltr"] .buy{font-family:var(--lat)}

  /* ---- Phones, part 2: compact scannable list (thumbnail beside the text).
     Placed after the base card rules so these win when the viewport is a phone. ---- */
  @media(max-width:639px){
    .grid{gap:12px}
    .card{flex-direction:row;align-items:stretch}
    .card .shot{width:116px;flex:none;aspect-ratio:auto;align-self:stretch}
    .card .body{padding:12px 14px;min-width:0}
    .card .strip{margin-bottom:6px}
    .card .name{font-size:15px;margin-bottom:6px;line-height:1.4}
    .card .verdict{font-size:13px;line-height:1.65;margin-bottom:10px}
    .card .foot{padding-top:0;border-top:0}
    .card .buy{display:inline-block;width:auto;padding:8px 18px;font-size:12px}
  }
</style>

let lang='ar', active='__all__', term='', PICKS=[], CATS=[];
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function mark(t,q){
  const s = esc(t);
  if(!q) return s;
  return s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
}

/* CSV parser: handles quoted fields, commas and newlines inside them */
function parseCSV(text){
  const rows=[]; let row=[], f='', inQ=false;
  text = text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else inQ=false; }
      else f+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(f); f=''; }
      else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
      else if(c!=='\r') f+=c;
    }
  }
  if(f.length||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()!==''));
}

function rowsToPicks(rows){
  const head = rows[0].map(h=>h.trim().toLowerCase());
  const at = n => head.indexOf(n);
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i], g=n=>(r[at(n)]||'').trim();
    if(g('show').toLowerCase()==='no') continue;         // hide a row from the sheet
    if(!g('name_ar') && !g('name_en')) continue;
    out.push({
      cat_ar:g('category_ar'), cat_en:g('category_en'),
      name_ar:g('name_ar'),    name_en:g('name_en'),
      verdict_ar:g('verdict_ar'), verdict_en:g('verdict_en'),
      url:g('url')||'#', img:g('image')
    });
  }
  return out;
}

function buildCats(){
  const seen=new Map();
  PICKS.forEach(p=>{ if(p.cat_en && !seen.has(p.cat_en)) seen.set(p.cat_en,{ar:p.cat_ar,en:p.cat_en}); });
  CATS=[...seen.values()];
}

const nameOf    = p => (lang==='ar'?p.name_ar   :p.name_en)    || p.name_en    || p.name_ar;
const verdictOf = p => (lang==='ar'?p.verdict_ar:p.verdict_en) || p.verdict_en || p.verdict_ar;
const catOf     = p => (lang==='ar'?p.cat_ar    :p.cat_en)     || p.cat_en;

function renderChrome(){
  const t=T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir  = lang==='ar'?'rtl':'ltr';
  $('eyebrow').textContent = t.eyebrow;
  $('h1').innerHTML   = t.h1;
  $('lede').innerHTML = t.lede;
  $('disc-h').textContent = t.discH;
  $('disc-p').innerHTML   = t.discP;
  $('partner').textContent = t.partner;
  $('lang').textContent = t.toggle;
  /* the toggle shows an Arabic glyph in English mode; Arabic never takes tracking */
  $('lang').style.letterSpacing = /[؀-ۿ]/.test(t.toggle) ? '0' : '';
  $('q').placeholder = t.search;
  $('lock-ar').style.display  = lang==='ar'?'block':'none';
  $('lock-lat').style.display = lang==='ar'?'none' :'block';
  const vals=[String(PICKS.length),"580K","#1"];
  $('stats').innerHTML = t.statL.map((l,i)=>
    `<div><div class="stat-n">${esc(vals[i])}</div><div class="stat-l">${esc(l)}</div></div>`).join('');
}

function renderFilters(){
  const t=T[lang];
  const list=[{key:'__all__',label:t.all},...CATS.map(c=>({key:c.en,label:lang==='ar'?c.ar:c.en}))];
  $('filters').innerHTML='';
  list.forEach(c=>{
    const b=document.createElement('button');
    b.className='chip'; b.type='button'; b.textContent=c.label;
    b.setAttribute('aria-pressed',String(c.key===active));
    b.addEventListener('click',()=>{active=c.key;renderFilters();renderGrid();});
    $('filters').appendChild(b);
  });
}

const matches=(p,q)=> !q || [p.name_ar,p.name_en,p.verdict_ar,p.verdict_en,p.cat_ar,p.cat_en]
  .join(' ').toLowerCase().includes(q.toLowerCase());

function cardHTML(p,t,hl){
  const nm = hl ? mark(nameOf(p),term) : esc(nameOf(p));
  const vd = hl ? mark(verdictOf(p),term) : esc(verdictOf(p));
  return `
    <article class="card">
      <div class="shot">
        ${p.img ? `<img src="${esc(p.img)}" alt="${esc(nameOf(p))}" loading="lazy">`
                : `<span class="ph">${esc(t.addimg)}</span>`}
      </div>
      <div class="body">
        <div class="strip">
          <span class="cat">${esc(catOf(p))}</span>
          <span class="tested">${esc(t.tested)}</span>
        </div>
        <h3 class="name">${nm}</h3>
        <p class="verdict">${vd}</p>
        <div class="foot">
          <a class="buy" href="${esc(p.url)}" target="_blank" rel="nofollow sponsored noopener">${esc(t.buy)}</a>
        </div>
      </div>
    </article>`;
}

function renderGrid(){
  const t=T[lang];
  const list=PICKS.filter(p=>active==='__all__'||p.cat_en===active).filter(p=>matches(p,term));
  $('count').textContent = t.showing(list.length);

  if(!list.length){
    $('grid').innerHTML = `<div class="state"><b>${esc(t.emptyT)}</b>${esc(t.emptyS)}</div>`;
    return;
  }

  $('grid').innerHTML = list.map(p=>cardHTML(p,t,true)).join('');
}

const renderAll=()=>{renderChrome();renderFilters();renderGrid();};

async function load(){
  $('grid').innerHTML = Array.from({length:6},()=>'<div class="skel"></div>').join('');
  try{
    const res = await fetch(DATA,{cache:'no-store'});
    if(!res.ok) throw new Error('products.csv fetch failed');
    const list = rowsToPicks(parseCSV(await res.text()));
    PICKS = list.length ? list : FALLBACK;
  }catch(err){
    console.warn('Using fallback list:', err.message);
    PICKS = FALLBACK;
  }
  buildCats();
  renderAll();
}

$('q').addEventListener('input',e=>{
  term=e.target.value.trim();
  $('clear').classList.toggle('on',term.length>0);
  renderGrid();
});
$('clear').addEventListener('click',()=>{
  term=''; $('q').value=''; $('clear').classList.remove('on'); $('q').focus(); renderGrid();
});
$('lang').addEventListener('click',()=>{ lang = lang==='ar'?'en':'ar'; renderAll(); });

load();
</script>
</body>
</html>
